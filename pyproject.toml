[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpad"
version = "0.0.1"
description = "Floating AI scratchpad — ask, save, search. Cross-platform desktop. Local-first, BYO-model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pynput>=1.7",
    "zeroconf>=0.131",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "keyring>=25.2",
    "markdown-it-py>=3.0",
    "dateparser>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-dateparser",
]

[project.scripts]
smartpad = "smartpad.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
